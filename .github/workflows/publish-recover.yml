name: Publish recover

# Spec 002 / T016 / FR-017a. Manual recovery for partial-success
# publish runs. The maintainer copies the `gh workflow run` line from
# the failing publish.yml's summary and runs it here; this workflow
# republishes ONLY the listed targets for the same tag.
#
# Runner: ubuntu-latest (GitHub-hosted). See ci.yml comment header.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to recover (e.g. v1.0.0 or v1.0.0-pre.1)"
        required: true
        type: string
      targets:
        description: "Comma-separated platform list (e.g. darwin-arm64,win32-x64)"
        required: true
        type: string

# Share the publish-${{ tag }} concurrency group with publish.yml so
# the maintainer can't trigger recovery WHILE the original publish is
# still attempting per-target retries.
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (validate tag)
    runs-on: ubuntu-latest
    if: github.repository == 'irulast/cnpg4vscode'
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tagsha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve tag → SHA
        id: tagsha
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} does not exist in this repository."
            exit 1
          fi
          SHA=$(git rev-list -n 1 "refs/tags/${TAG}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Validate tag at its own commit
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Check out the tag's commit so validate-tag sees the right
          # package.json#version.
          git checkout "refs/tags/${TAG}"
          OUT=$(node scripts/ci/validate-tag.mjs "${TAG}")
          echo "$OUT"
          CHANNEL=$(echo "$OUT" | sed -n 's/^channel=\([^;]*\);.*/\1/p')
          VERSION=$(echo "$OUT" | sed -n 's/^.*;version=\(.*\)$/\1/p')
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  recover:
    name: Republish failed targets
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Try to download the artifact bundle from the original publish
      # run (if still within retention). If it's gone, fall back to
      # rebuilding for the requested targets.
      - name: Attempt to download original artifact bundle
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vsix-bundle-${{ inputs.tag }}
          path: vsix-bundle/
      - name: Build artifacts if bundle missing
        if: steps.download.outcome != 'success'
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          echo "::notice::Original artifact bundle not found; rebuilding for the requested targets."
          pnpm build
          IFS=',' read -ra TARGETS <<< "${{ inputs.targets }}"
          PRE_FLAG=""
          if [[ "$CHANNEL" == "pre-release" ]]; then
            PRE_FLAG="--pre-release"
          fi
          for t in "${TARGETS[@]}"; do
            # shellcheck disable=SC2086
            pnpm package -- --target "$t" $PRE_FLAG
          done
          mkdir -p vsix-bundle
          mv dist/vsix/*.vsix vsix-bundle/ 2>/dev/null || true
          mv dist/*.vsix vsix-bundle/ 2>/dev/null || true
          mv ./*.vsix vsix-bundle/ 2>/dev/null || true
          ls -la vsix-bundle/
      - name: Republish requested targets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # vsce is a devDependency — local bin dir on PATH.
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/ci/publish-vsix.mjs \
            --tag "${{ inputs.tag }}" \
            --channel "${{ needs.preflight.outputs.channel }}" \
            --artifacts-dir ./vsix-bundle \
            --targets "${{ inputs.targets }}"
