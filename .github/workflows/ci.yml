name: CI Gate

# CI gate per spec 002. Runs on every PR targeting main and every push
# to main. Fork PRs use `pull_request` (not `pull_request_target`) so
# secrets are unavailable to fork execution contexts by GitHub's design
# (see contracts/workflow-triggers.md + research §5).
#
# This workflow replaces the spec 001-era ci.yml that targeted
# `ubuntu-latest`, used pnpm v9 / Node 20, ran the not-yet-implemented
# `pnpm test:e2e` harness, and lacked the single summary check that
# branch protection keys off of.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (hosted-runner refusal + actionlint)
    runs-on: [self-hosted, linux, X64, mke-builds]
    steps:
      - name: Refuse hosted runners (FR-004 / SC-008)
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-self-hosted}" != "self-hosted" ]]; then
            echo "::error::Hosted runner detected (${RUNNER_ENVIRONMENT}); this workflow requires self-hosted."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Lint workflow YAML (actionlint v1.7.7)
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  gate:
    name: Gate (typecheck + lint + test + build + audits)
    needs: preflight
    runs-on: [self-hosted, linux, X64, mke-builds]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract tests
        run: pnpm test:contract

      - name: Production build
        run: pnpm build

      - name: Webview CSP audit
        run: pnpm audit:csp

      - name: Dependency licence audit
        run: pnpm audit:deps

      - name: Security advisory scan (FR-030)
        run: |
          # pnpm audit returns non-zero on findings; our parser is what
          # decides pass/fail against the allowlist, so we capture and
          # hand the JSON over rather than letting pnpm's exit code
          # gate the step.
          pnpm audit --prod --json > audit.json || true
          node scripts/ci/scan-advisories.mjs \
            --audit-json audit.json \
            --allowlist .github/security-allowlist.json

  summary:
    name: summary
    needs: gate
    runs-on: [self-hosted, linux, X64, mke-builds]
    steps:
      # Single zero-step job whose only purpose is to give branch
      # protection a stable check name ("CI Gate / summary") to require.
      # Reaching this job means every prior stage passed.
      - run: echo "All quality gates passed."
